<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <rect width="40" height="40" rx="8" fill="#6636CC"/>
  <!-- مثلث الرسم الهندسي Set Square -->
  <polygon points="10,30 30,30 10,10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="14,26 24,26 14,16" fill="none" stroke="#D8C9F8" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- علامات قياس المسطرة -->
  <line x1="14" y1="26" x2="14" y2="23" stroke="#D8C9F8" stroke-width="1"/>
  <line x1="18" y1="26" x2="18" y2="23" stroke="#D8C9F8" stroke-width="1"/>
  <line x1="22" y1="26" x2="22" y2="23" stroke="#D8C9F8" stroke-width="1"/>
  <!-- مربع هندسي صغير في الرأس -->
  <rect x="25" y="10" width="5" height="5" rx="1" fill="#FFFFFF"/>
</svg>
